[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trip-architecture-study"
version = "0.2.0"
description = "Saved-catalog trip planning: workflow, single agent, coordinated MAS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["openai>=2,<3"]
reports = [] # CSV/JSON/SVG reports use the standard library.
timezone = ["tzdata>=2025.1"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.data-files]
prompts = ["prompts/*.txt"]
